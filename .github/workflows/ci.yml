# CI from the CI section of docs/PROJECTSPEC.md. Three jobs run in parallel,
# and a failure in any of them fails the check on the pull request.
# Pushes to main run the same checks. Phase 8 adds deploy jobs that need them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Install, start PostgreSQL, migrate, test, then lint and format checks.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: applications_tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d applications_tracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # CI-only values. They sign test tokens and open a database that is
    # deleted when the job ends, so they are not secrets.
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: applications_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      NUM_PROXIES: "0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  # Lint, format check, then the production build (tsc -b and vite build).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

  # The API image that Compose runs locally and ECS runs in production.
  # Built only. Phase 8 pushes it to ECR.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build --tag applications-tracker-api:ci backend
